<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#264191",
                        "surface-container-low": "#f2f4f6",
                        "primary-fixed": "#dce1ff",
                        "on-tertiary-fixed": "#25005a",
                        "tertiary-fixed-dim": "#d2bbff",
                        "primary-fixed-dim": "#b6c4ff",
                        "surface-container-highest": "#e0e3e5",
                        "outline-variant": "#c5c5d3",
                        "primary-container": "#1e3a8a",
                        "primary": "#00236f",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "on-secondary-container": "#006f66",
                        "error": "#ba1a1a",
                        "surface": "#f7f9fb",
                        "surface-dim": "#d8dadc",
                        "on-background": "#191c1e",
                        "tertiary-container": "#5200b5",
                        "on-surface-variant": "#444651",
                        "surface-container": "#eceef0",
                        "on-secondary-fixed-variant": "#005049",
                        "on-primary": "#ffffff",
                        "secondary": "#006a61",
                        "on-surface": "#191c1e",
                        "on-primary-fixed": "#00164e",
                        "secondary-container": "#86f2e4",
                        "error-container": "#ffdad6",
                        "secondary-fixed": "#89f5e7",
                        "on-tertiary-fixed-variant": "#5a00c6",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary-container": "#bc9bff",
                        "on-error-container": "#93000a",
                        "tertiary-fixed": "#eaddff",
                        "secondary-fixed-dim": "#6bd8cb",
                        "on-secondary-fixed": "#00201d",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "inverse-primary": "#b6c4ff",
                        "surface-container-high": "#e6e8ea",
                        "background": "#f7f9fb",
                        "tertiary": "#37007e",
                        "on-primary-container": "#90a8ff",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary": "#ffffff",
                        "outline": "#757682",
                        "surface-tint": "#4059aa"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "container-max": "1200px",
                        "unit": "8px",
                        "margin-mobile": "16px",
                        "margin-desktop": "40px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Noto Sans SC"],
                        "headline-lg-mobile": ["Noto Sans SC"],
                        "body-md": ["Noto Sans SC"],
                        "headline-md": ["Noto Sans SC"],
                        "label-md": ["Inter"],
                        "body-sm": ["Noto Sans SC"],
                        "label-sm": ["Inter"],
                        "body-lg": ["Noto Sans SC"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "1.2", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                        "label-md": ["14px", {"lineHeight": "1", "fontWeight": "500"}],
                        "body-sm": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "1", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #f7f9fb;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 106, 97, 0.03) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 35, 111, 0.03) 0px, transparent 50%);
        }
        .login-card {
            box-shadow: 0px 4px 12px rgba(0,0,0,0.03), 0px 10px 25px rgba(0,0,0,0.02);
        }
        .ai-glow-accent {
            background: linear-gradient(135deg, #006a61 0%, #00236f 100%);
            box-shadow: 0 0 15px rgba(0, 106, 97, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-on-surface">
<!-- Transactional Header: Navigation Suppressed per Rule -->
<header class="w-full h-16 flex items-center px-margin-desktop bg-transparent fixed top-0 left-0 z-50">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-headline-md" style="font-variation-settings: 'FILL' 1;">description</span>
<span class="font-headline-md text-headline-md font-bold text-primary">智汇简历助手</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-mobile py-24">
<div class="w-full max-w-[440px] animate-fade-in">
<!-- Center Login Card -->
<div class="login-card bg-surface-container-lowest border border-outline-variant rounded-xl p-8 md:p-10">
<!-- Branding & Title -->
<div class="mb-10 text-center">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">欢迎回来</h1>
<p class="font-body-md text-on-surface-variant">登录以继续您的职场进阶之旅</p>
</div>
<!-- Login Form -->
<form class="space-y-6">
<!-- Identifier Input -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="identifier">手机号/邮箱</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
<input class="w-full pl-11 pr-4 py-3 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" id="identifier" name="identifier" placeholder="请输入您的手机号或电子邮箱" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">密码</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-11 pr-11 py-3 bg-surface rounded-lg border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" id="password" name="password" placeholder="请输入您的登录密码" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">记住我</span>
</label>
<a class="font-body-sm text-body-sm text-primary hover:underline transition-all" href="#">忘记密码?</a>
</div>
<!-- Primary Action -->
<button class="w-full py-3.5 bg-primary text-on-primary font-headline-md text-body-md rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        立即登录
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- AI Divider -->
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-label-sm text-label-sm bg-surface-container-lowest px-2 text-outline">
                            其他登录方式
                        </div>
</div>
<!-- AI Smart Login Action -->
<button class="w-full py-3 border border-outline-variant rounded-lg font-body-md flex items-center justify-center gap-3 hover:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
                        使用微信扫码快速登录
                    </button>
</form>
<!-- Footer Link -->
<div class="mt-10 text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        还没有账号？
                        <a class="text-primary font-bold hover:underline" href="#">立即注册</a>
</p>
</div>
</div>
<!-- Side Decorative Illustration or Trust Elements (Bento style hint) -->
<div class="mt-12 grid grid-cols-2 gap-4">
<div class="bg-surface-container-low border border-outline-variant p-4 rounded-lg flex items-center gap-3">
<div class="ai-glow-accent w-10 h-10 rounded-full flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-white text-[20px]">security</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface font-bold">数据加密</p>
<p class="text-[10px] text-on-surface-variant leading-tight">银行级信息安全保障</p>
</div>
</div>
<div class="bg-surface-container-low border border-outline-variant p-4 rounded-lg flex items-center gap-3">
<div class="ai-glow-accent w-10 h-10 rounded-full flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-white text-[20px]">bolt</span>
</div>
<div>
<p class="font-label-sm text-label-sm text-on-surface font-bold">智能提效</p>
<p class="text-[10px] text-on-surface-variant leading-tight">AI助力简历快速过筛</p>
</div>
</div>
</div>
</div>
</main>
<!-- Standard Footer Component from JSON -->
<footer class="w-full py-12 px-margin-desktop flex flex-col items-center gap-6 bg-surface-container-lowest dark:bg-inverse-surface border-t border-outline-variant dark:border-on-surface-variant">
<div class="font-headline-md text-headline-md font-bold text-primary">智汇简历助手</div>
<nav class="flex flex-wrap justify-center gap-x-8 gap-y-2">
<a class="font-body-sm text-body-sm text-on-surface-variant dark:text-surface-variant hover:text-secondary dark:hover:text-secondary-fixed transition-all" href="#">服务条款</a>
<a class="font-body-sm text-body-sm text-on-surface-variant dark:text-surface-variant hover:text-secondary dark:hover:text-secondary-fixed transition-all" href="#">隐私政策</a>
<a class="font-body-sm text-body-sm text-on-surface-variant dark:text-surface-variant hover:text-secondary dark:hover:text-secondary-fixed transition-all" href="#">联系支持</a>
<a class="font-body-sm text-body-sm text-on-surface-variant dark:text-surface-variant hover:text-secondary dark:hover:text-secondary-fixed transition-all" href="#">常见问题</a>
</nav>
<p class="font-body-sm text-body-sm text-on-surface-variant dark:text-surface-variant text-center">
            © 2024 智汇简历助手 | 智能驱动 职场领先
        </p>
</footer>
<!-- Background Decoration for Visual Depth -->
<div class="fixed top-[20%] -right-24 w-96 h-96 bg-primary/5 rounded-full blur-[100px] pointer-events-none -z-10"></div>
<div class="fixed bottom-[10%] -left-24 w-80 h-80 bg-secondary/5 rounded-full blur-[80px] pointer-events-none -z-10"></div>
</body></html>
