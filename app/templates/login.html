{% extends "base.html" %}

{% block title %}登录 - 智汇简历助手{% endblock %}

{% block navbar %}
<!-- Minimal Transactional Header -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-desktop h-16 bg-surface/80 backdrop-blur-md border-b border-outline-variant">
    <a href="/" class="font-headline-md text-headline-md font-bold text-primary">智汇简历助手</a>
    <div class="flex items-center gap-2">
        <span class="text-body-sm text-on-surface-variant">没有账号？</span>
        <a href="/auth/register" class="px-4 py-2 text-primary font-medium hover:text-primary-container transition-all active:scale-95 text-label-md">立即注册</a>
    </div>
</header>
{% endblock %}

{% block content %}
<section class="min-h-screen flex items-center justify-center pt-16 px-margin-mobile relative overflow-hidden">
    <!-- Decorative Background Circles -->
    <div class="absolute top-[-120px] right-[-80px] w-[300px] h-[300px] rounded-full bg-primary-fixed/40 blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-[-100px] left-[-60px] w-[260px] h-[260px] rounded-full bg-secondary-container/30 blur-3xl pointer-events-none"></div>
    <div class="absolute top-[40%] left-[15%] w-[180px] h-[180px] rounded-full bg-tertiary-fixed/25 blur-3xl pointer-events-none"></div>

    <!-- Login Card -->
    <div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-2xl p-8 shadow-lg relative z-10">
        <!-- Title Area -->
        <div class="text-center mb-8">
            <span class="material-symbols-outlined text-[48px] text-secondary mb-2" style="font-variation-settings: 'FILL' 1;">person</span>
            <h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface">欢迎回来</h1>
            <p class="text-on-surface-variant text-body-sm mt-2">登录以继续使用智能简历服务</p>
        </div>

        <!-- Error Message -->
        {% if error %}
        <div class="mb-5 p-3 bg-error-container/60 border border-error/30 rounded-lg flex items-center gap-2">
            <span class="material-symbols-outlined text-error text-[20px]">error</span>
            <p class="text-error text-body-sm">{{ error }}</p>
        </div>
        {% endif %}

        <!-- Login Form -->
        <form action="/auth/login" method="POST" class="space-y-5">
            <!-- Identifier Field -->
            <div class="space-y-1.5">
                <label for="identifier" class="text-label-md text-on-surface-variant">账号</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant/60 text-[20px]">mail</span>
                    <input
                        type="text"
                        id="identifier"
                        name="identifier"
                        placeholder="手机号或邮箱"
                        required
                        class="w-full pl-10 pr-4 py-3 border border-outline-variant bg-surface-container-low text-on-surface text-body-md rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all placeholder:text-on-surface-variant/50"
                    />
                </div>
            </div>

            <!-- Password Field -->
            <div class="space-y-1.5">
                <div class="flex justify-between items-center">
                    <label for="password" class="text-label-md text-on-surface-variant">密码</label>
                    <a href="#" class="text-label-sm text-secondary hover:text-secondary-container transition-colors">忘记密码</a>
                </div>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 material-symbols-outlined text-on-surface-variant/60 text-[20px]">lock</span>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="请输入密码"
                        required
                        class="w-full pl-10 pr-12 py-3 border border-outline-variant bg-surface-container-low text-on-surface text-body-md rounded-lg focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary transition-all placeholder:text-on-surface-variant/50"
                    />
                    <button
                        type="button"
                        id="togglePassword"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/60 hover:text-on-surface transition-colors"
                    >
                        <span class="material-symbols-outlined text-[20px]" id="eyeIcon">visibility_off</span>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full py-3 bg-primary text-on-primary rounded-lg font-body-md text-body-md font-medium shadow-md hover:bg-primary-container transition-all active:scale-[0.98]"
            >
                立即登录
            </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-3 my-6">
            <div class="flex-1 h-px bg-outline-variant"></div>
            <span class="text-label-sm text-on-surface-variant">其他方式</span>
            <div class="flex-1 h-px bg-outline-variant"></div>
        </div>

        <!-- WeChat Login (Decorative) -->
        <button
            type="button"
            class="w-full flex items-center justify-center gap-3 py-3 border border-outline-variant bg-surface-container-low rounded-lg hover:bg-surface-container transition-colors active:scale-[0.98]"
        >
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="#07C160">
                <path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.045c.133 0 .241-.11.241-.245 0-.06-.023-.12-.038-.177l-.327-1.233a.49.49 0 0 1 .177-.554C23.41 18.308 24 16.926 24 15.402c0-3.372-3.28-6.15-7.062-6.544zm-2.007 2.77c.535 0 .969.44.969.983a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.983a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982z"/>
            </svg>
            <span class="text-body-sm text-on-surface font-medium">微信登录</span>
        </button>

        <!-- Mobile Register Link -->
        <div class="mt-6 text-center md:hidden">
            <span class="text-body-sm text-on-surface-variant">没有账号？</span>
            <a href="/auth/register" class="text-body-sm text-secondary font-medium hover:text-secondary-container transition-colors">立即注册</a>
        </div>
    </div>
</section>

<script>
document.addEventListener('DOMContentLoaded', function() {
    var toggleBtn = document.getElementById('togglePassword');
    var passwordInput = document.getElementById('password');
    var eyeIcon = document.getElementById('eyeIcon');
    if (toggleBtn && passwordInput && eyeIcon) {
        toggleBtn.addEventListener('click', function() {
            var isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
        });
    }
});
</script>
{% endblock %}

{% block footer %}{% endblock %}
