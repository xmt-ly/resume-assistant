{% extends "base.html" %}
{% block title %}技能分析{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="flex items-center justify-between mb-6">
        <div>
            <a href="/resume/preview/{{ resume.id }}" class="text-sm text-gray-400 hover:text-gray-600">&larr; 返回简历预览</a>
            <h1 class="text-2xl font-bold text-gray-800 mt-2">技能差距分析</h1>
            <p class="text-sm text-gray-500 mt-1">了解你的技能与职位要求的匹配情况</p>
        </div>
        <button onclick="loadAnalysis({{ resume.id }})"
                class="px-4 py-2 bg-purple-500 text-white rounded-lg text-sm font-medium hover:bg-purple-600 transition-colors">
            重新分析
        </button>
    </div>

    <div id="loadingSection" class="text-center py-20">
        <div class="inline-block w-8 h-8 border-4 border-purple-200 border-t-purple-500 rounded-full animate-spin"></div>
        <p class="text-gray-500 text-sm mt-3">正在分析技能差距...</p>
    </div>

    <div id="resultSection" class="hidden">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 text-center mb-6">
            <p class="text-sm text-gray-500 mb-2">总体匹配度</p>
            <div class="relative w-40 h-40 mx-auto">
                <svg class="w-40 h-40 -rotate-90" viewBox="0 0 120 120">
                    <circle cx="60" cy="60" r="52" fill="none" stroke="#e5e7eb" stroke-width="8"/>
                    <circle id="matchCircle" cx="60" cy="60" r="52" fill="none" stroke-width="8"
                            stroke-dasharray="0 326.73"
                            class="transition-all duration-1000 ease-out"
                            stroke-linecap="round"/>
                </svg>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span id="matchPercent" class="text-4xl font-bold">0%</span>
                </div>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-6 mb-6">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                <h3 class="text-sm font-medium text-gray-500 mb-3 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
                    已匹配技能
                </h3>
                <p id="matchingEmpty" class="text-gray-400 text-sm hidden">暂无匹配技能</p>
                <div id="matchingSkills" class="flex flex-wrap gap-2"></div>
            </div>
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                <h3 class="text-sm font-medium text-gray-500 mb-3 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-orange-500 inline-block"></span>
                    待提升技能
                </h3>
                <p id="gapsEmpty" class="text-gray-400 text-sm hidden">暂无待提升技能</p>
                <div id="gapSkills" class="flex flex-wrap gap-2"></div>
            </div>
        </div>

        <div id="partialSection" class="hidden">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-6">
                <h3 class="text-sm font-medium text-gray-500 mb-3 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
                    部分匹配技能
                </h3>
                <div id="partialSkills" class="space-y-2"></div>
            </div>
        </div>

        <div id="recSection" class="hidden">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                <h3 class="text-sm font-medium text-gray-500 mb-4">学习建议</h3>
                <div id="recommendations" class="space-y-4"></div>
            </div>
        </div>
    </div>
</div>

<style>[x-cloak] { display: none !important; }</style>
<script>
function loadAnalysis(resumeId) {
    document.getElementById('loadingSection').classList.remove('hidden');
    document.getElementById('resultSection').classList.add('hidden');

    fetch('/api/analysis/' + resumeId, { method: 'POST' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var percent = data.overall_match_percentage || 0;

        var circle = document.getElementById('matchCircle');
        circle.setAttribute('stroke-dasharray', (percent / 100 * 326.73) + ' 326.73');
        circle.setAttribute('stroke', percent >= 70 ? '#22c55e' : percent >= 40 ? '#eab308' : '#ef4444');

        document.getElementById('matchPercent').textContent = percent + '%';
        document.getElementById('matchPercent').className = 'text-4xl font-bold ' + (percent >= 70 ? 'text-green-600' : percent >= 40 ? 'text-yellow-600' : 'text-red-600');

        renderSkills('matchingSkills', 'matchingEmpty', data.matching_skills || [], 'green');
        renderSkills('gapSkills', 'gapsEmpty', data.gap_skills || [], 'orange');

        var partials = data.partial_skills || [];
        var partialSection = document.getElementById('partialSection');
        var partialDiv = document.getElementById('partialSkills');
        partialDiv.innerHTML = '';
        if (partials.length > 0) {
            partials.forEach(function(s) {
                var d = document.createElement('div');
                d.className = 'flex items-start gap-2 text-sm';
                d.innerHTML = '<span class="text-yellow-500 font-medium shrink-0">' + esc(s.name) + '</span>' +
                    (s.note ? '<span class="text-gray-400 text-xs">' + esc(s.note) + '</span>' : '');
                partialDiv.appendChild(d);
            });
            partialSection.classList.remove('hidden');
        } else {
            partialSection.classList.add('hidden');
        }

        var recs = data.recommendations || [];
        var recSection = document.getElementById('recSection');
        var recDiv = document.getElementById('recommendations');
        recDiv.innerHTML = '';
        if (recs.length > 0) {
            recs.forEach(function(r) {
                var priority = r.priority || 'medium';
                var borderColor = priority === 'high' ? 'border-red-400' : priority === 'medium' ? 'border-yellow-400' : 'border-gray-300';
                var badgeClass = priority === 'high' ? 'bg-red-50 text-red-600' : priority === 'medium' ? 'bg-yellow-50 text-yellow-600' : 'bg-gray-100 text-gray-500';
                var badgeText = priority === 'high' ? '优先' : priority === 'medium' ? '建议' : '可选';

                var d = document.createElement('div');
                d.className = 'border-l-4 pl-4 py-2 ' + borderColor;
                var html = '<div class="flex items-center gap-2 mb-1">' +
                    '<span class="font-medium text-sm text-gray-800">' + esc(r.skill) + '</span>' +
                    '<span class="text-xs px-1.5 py-0.5 rounded ' + badgeClass + '">' + badgeText + '</span>' +
                    '</div>' +
                    (r.reason ? '<p class="text-xs text-gray-500 mb-1">' + esc(r.reason) + '</p>' : '');

                if (r.resources && r.resources.length) {
                    html += '<div class="flex flex-wrap gap-1">';
                    r.resources.forEach(function(res) {
                        html += '<span class="text-xs bg-gray-50 text-gray-500 px-2 py-0.5 rounded">📖 ' + esc(res) + '</span>';
                    });
                    html += '</div>';
                }
                d.innerHTML = html;
                recDiv.appendChild(d);
            });
            recSection.classList.remove('hidden');
        } else {
            recSection.classList.add('hidden');
        }

        document.getElementById('loadingSection').classList.add('hidden');
        document.getElementById('resultSection').classList.remove('hidden');
    })
    .catch(function() {
        document.getElementById('loadingSection').classList.add('hidden');
        window.showToast('分析加载失败，请重试', 'error');
    });
}

function renderSkills(containerId, emptyId, skills, color) {
    var container = document.getElementById(containerId);
    var empty = document.getElementById(emptyId);
    container.innerHTML = '';
    if (skills.length === 0) {
        empty.classList.remove('hidden');
        return;
    }
    empty.classList.add('hidden');
    var bgClass = color === 'green' ? 'bg-green-50 text-green-700' : 'bg-orange-50 text-orange-700';
    skills.forEach(function(s) {
        var span = document.createElement('span');
        span.className = bgClass + ' text-xs px-3 py-1.5 rounded-full font-medium';
        span.textContent = s.name + (s.proficiency ? ' (' + s.proficiency + ')' : '') + (s.required_level ? ' (' + s.required_level + ')' : '');
        container.appendChild(span);
    });
}

function esc(str) {
    var d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
}

loadAnalysis({{ resume.id }});
</script>
{% endblock %}
