{% extends "base.html" %}
{% block title %}简历助手 - 开始{% endblock %}
{% block content %}
<div class="py-12" x-data>
    <div class="text-center mb-12">
        <h1 class="text-4xl font-bold text-gray-900 mb-4">让你的简历脱颖而出</h1>
        <p class="text-lg text-gray-500 max-w-2xl mx-auto">
            粘贴 Boss 直聘的招聘要求或上传截图，AI 帮你生成高度匹配的简历和技能提升建议
        </p>
    </div>

    <div class="grid md:grid-cols-2 gap-8 max-w-3xl mx-auto">
        <a href="/job/input?method=text"
           class="group relative bg-white rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 p-8 border border-gray-100 hover:border-blue-200">
            <div class="w-14 h-14 bg-blue-50 rounded-xl flex items-center justify-center mb-5 group-hover:scale-110 transition-transform">
                <svg class="w-7 h-7 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
            </div>
            <h2 class="text-xl font-semibold text-gray-800 mb-2">粘贴文本</h2>
            <p class="text-gray-500 text-sm leading-relaxed">
                直接复制 Boss 直聘上的职位描述，粘贴到文本框中即可快速分析
            </p>
        </a>

        <a href="/job/input?method=screenshot"
           class="group relative bg-white rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 p-8 border border-gray-100 hover:border-blue-200">
            <div class="w-14 h-14 bg-blue-50 rounded-xl flex items-center justify-center mb-5 group-hover:scale-110 transition-transform">
                <svg class="w-7 h-7 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
            </div>
            <h2 class="text-xl font-semibold text-gray-800 mb-2">上传截图</h2>
            <p class="text-gray-500 text-sm leading-relaxed">
                截取 Boss 直聘 App 或网页中的招聘信息截图，AI 自动识别文字并分析
            </p>
        </a>
    </div>
</div>
{% endblock %}
